# tuya.official：涂鸦设备控制策略（按重构前功能拆分的官方插件）。
[package]
name = "tuya-official"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# 与宿主 server/Cargo.toml 钉版一致：单源 protocol.rs 在 guest 内编译所需
hmac = "0.13.0"
sha2 = "0.11.0"
# S3f：LAN 0x6699（3.5）帧 AES-128-GCM；关闭 getrandom（guest 无熵源，IV 由调用方传入）
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
aes = "0.9"
# 从 plugins-src/<dir>/ 出发：两级向上到仓库根
xiaozhi-plugin-sdk = { path = "../../server/crates/xiaozhi-plugin-sdk" }
guest-alloc = { path = "../../tools/wasm-fixtures/guest-alloc" }

# 独立 workspace（仓库根无 Cargo.toml）：体积优化 profile 在本 crate 生效
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

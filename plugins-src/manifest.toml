# 官方默认插件引导表（数据，不是代码——内核零插件知识，R3）。
#
# 启动引导（feature wasm-plugins）：数据卷 plugins/<id>.wasm 缺失时，系统按本表
# 调 Docker（镜像 xiaozhi-plugin-builder，见 tools/plugin-builder/）在 plugins-src/<dir>
# 执行 build.sh → 隔离验证 → 采用（写盘+装载）。无 Docker 时降级告警，
# 管理界面可上传已构建组件替代（POST /api/plugins/upload）。
#
# wasm 产物一律不入 git；本表与插件源码才是入库物。
[[plugins]]
id = "weather.official"
dir = "weather"

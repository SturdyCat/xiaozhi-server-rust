# 官方默认插件引导表（数据，不是代码——内核零插件知识，R3）。
#
# 分发模型（用户方向 2026-11-04，2026-11-06 简化为纯上传）：
# 生产装载只走管理界面上传已构建组件（POST /api/plugins/upload → 隔离验证 →
# 采用 → 数据卷 plugins/<id>.wasm → 立即生效；重启经数据卷扫描重装即注册）。
# 服务端不再做 Docker 自动构建；wasm 产物一律不入 git，本表与插件源码才是入库物。
# 开发态改插件源只重建 guest（plugins-src/<dir>/build.sh），永不触发主系统构建。
[[plugins]]
id = "weather.official"
dir = "weather"
package = "weather-official"

# 内置系统级扩展点探针：用于验证官方插件从构建产物到注册/激活的完整链路。
# 它不是用户自建插件，源码暂复用 WASM 测试夹具，生产构建仍通过本目录统一产物目录分发。
[[plugins]]
id = "hello.official"
source_dir = "tools/wasm-fixtures/hello"
package = "hello"

# 按重构前功能拆分出的官方插件（系统底座不编译业务面，功能一律由插件提供）。
# 每个插件独占一个宿主扩展点；hello.official 是拆分前的系统级探针，保留作回退。

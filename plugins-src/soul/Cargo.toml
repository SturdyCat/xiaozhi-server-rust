# soul.official：人格风格策略（按重构前功能拆分的官方插件）。
[package]
name = "soul-official"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# 从 plugins-src/<dir>/ 出发：两级向上到仓库根
xiaozhi-plugin-sdk = { path = "../../server/crates/xiaozhi-plugin-sdk" }
guest-alloc = { path = "../../tools/wasm-fixtures/guest-alloc" }

# 独立 workspace（仓库根无 Cargo.toml）：体积优化 profile 在本 crate 生效
[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

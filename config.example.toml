# xiaozhi-server-rust 配置样例
# 复制为 config.toml 并按需修改；或使用环境变量 XIAOZHI_CONFIG 指向本文件。

[server]
# 监听地址（宿主 ip:port）
listen = "0.0.0.0:8000"
# Bearer token；为空字符串表示不校验 Authorization 头
expected_token = ""

[audio]
# 服务器下行（TTS）采样率，写入服务器 hello，设备据此解码播放。
# 设备上行默认 16k，跟随设备 hello 的 audio_params。
downlink_sample_rate = 24000
downlink_frame_duration_ms = 60
channels = 1
# 下行二进制协议版本（1/2/3）；建议先用 1，真机验证后再切 2/3。
binary_protocol_version = 1

[asr]
# "sherpa" 使用真实 SenseVoice INT8；"mock" 无模型回显固定文本（本地联调）。
backend = "sherpa"
model = "/models/SenseVoiceSmall/model.onnx"
tokens = "/models/SenseVoiceSmall/tokens.txt"
language = "auto"
use_itn = true
num_threads = 3
provider = "cpu"

[vad]
model = "/models/silero_vad.onnx"
threshold = 0.5
min_silence_duration = 0.25
min_speech_duration = 0.25

[tts]
# "sherpa" 使用真实 Kokoro INT8；"mock" 生成静音（本地联调）。
backend = "sherpa"
model = "/models/Kokoro/model.onnx"
voices = "/models/Kokoro/voices.bin"
tokens = "/models/Kokoro/tokens.txt"
data_dir = "/models/Kokoro/espeak-ng-data"
dict_dir = "/models/Kokoro/dict"
lexicon = "/models/Kokoro/lexicon-us-en.txt,/models/Kokoro/lexicon-zh.txt"
speaker = 0
speed = 1.0
num_threads = 2

[llm]
# "mock" 使用本地回显（零配置联调）；"http" 调用真实 OpenAI 兼容接口。
backend = "http"
api_base = "https://api.example.com/v1/chat/completions"
api_key = "YOUR_API_KEY"
model = "gpt-4o"
system_prompt = "你是一个有用且简洁的中文语音助手。"
max_history = 10
temperature = 0.7

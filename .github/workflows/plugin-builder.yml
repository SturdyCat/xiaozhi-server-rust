name: WASM Plugin Builder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/plugin-builder/**"
      - "tools/wasm-fixtures/**"
      - "server/wit/**"
      - ".github/workflows/plugin-builder.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  builder-image:
    name: Build and exercise plugin builder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build builder image
        run: docker build --tag xiaozhi-plugin-builder:ci tools/plugin-builder

      - name: Build all WASM fixtures in builder image
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            xiaozhi-plugin-builder:ci \
            bash tools/wasm-fixtures/build.sh

      - name: Verify fixture outputs are component binaries
        run: |
          for artifact in server/tests/fixtures/wasm/hello.wasm \
                          server/tests/fixtures/wasm/greeter-user.wasm \
                          server/tests/fixtures/wasm/trap.wasm; do
            test -s "$artifact"
            wasm-tools validate "$artifact"
          done

      - name: Verify reproducible artifact digests
        run: |
          sha256sum \
            server/tests/fixtures/wasm/hello.wasm \
            server/tests/fixtures/wasm/greeter-user.wasm \
            server/tests/fixtures/wasm/trap.wasm > /tmp/wasm-fixtures.sha256
          sha256sum --check /tmp/wasm-fixtures.sha256
          awk 'NF == 2 && $1 ~ /^[0-9a-f]{64}$/ && $2 ~ /\\.wasm$/ { count++ } END { exit count == 3 ? 0 : 1 }' /tmp/wasm-fixtures.sha256

      - name: Upload attested WASM fixtures
        uses: actions/upload-artifact@v4
        with:
          name: wasm-fixtures-${{ github.sha }}
          if-no-files-found: error
          path: |
            server/tests/fixtures/wasm/hello.wasm
            server/tests/fixtures/wasm/greeter-user.wasm
            server/tests/fixtures/wasm/trap.wasm

      - name: Attest WASM fixture provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            server/tests/fixtures/wasm/hello.wasm
            server/tests/fixtures/wasm/greeter-user.wasm
            server/tests/fixtures/wasm/trap.wasm

      - name: Verify WASM fixture provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in server/tests/fixtures/wasm/hello.wasm \
                          server/tests/fixtures/wasm/greeter-user.wasm \
                          server/tests/fixtures/wasm/trap.wasm; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

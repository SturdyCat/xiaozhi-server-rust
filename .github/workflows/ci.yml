# xiaozhi-server-rust CI（P0-6）
#
# 两个 job：
# 1. test    —— cargo test（default feature 全量单测，PR 必过）；
#               sherpa feature 单测尽力跑（需系统 libopus + 下载原生库，环境不齐不阻塞 PR）。
# 2. protocol —— 构建并启动服务端，跑 tests/mock_client.py 协议联调（握手/协商 +
#               asr_test/tts_test/llm_test + abort/wakeup 场景）。
#               default feature 下服务端可能因缺模型/配置拒绝启动 → 显式 SKIP 并打印日志
#               （协议联调的强保障在带模型的本地/docker 环境，见 server/tests/README.md）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: cargo test（default features，必过）
        working-directory: server
        run: cargo test
      - name: cargo test --features sherpa（尽力跑：需系统 libopus 与原生库下载）
        working-directory: server
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y libopus-dev
          cargo test --features sherpa

  protocol:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: 构建（default feature）
        working-directory: server
        run: cargo build
      - name: 启动服务端并跑协议联调（无法启动则显式 SKIP）
        working-directory: server
        run: |
          ./target/debug/xiaozhi-server-rust > /tmp/server.log 2>&1 &
          SRV=$!
          up=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then up=1; break; fi
            if ! kill -0 "$SRV" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "SKIP: 服务端未能启动（default feature 下缺模型/配置属预期），跳过协议联调"
            echo "---- server log（尾 30 行）----"
            tail -30 /tmp/server.log
            exit 0
          fi
          python3 tests/mock_client.py --host 127.0.0.1 --port 8000

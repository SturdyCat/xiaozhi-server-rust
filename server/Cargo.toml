[package]
name = "xiaozhi-server-rust"
version = "0.1.0"
edition = "2021"
description = "本地 ASR/TTS (sherpa-onnx) + 远程 LLM 的 xiaozhi-esp32 语音服务端"
license = "MIT"

[features]
# 默认仅启用 mock 后端，纯 Rust 即可编译（无需模型文件与系统 Opus 库）。
# 在有网络/模型的目标机上用 `--features sherpa` 启用真实 SenseVoice/Kokoro/Silero 引擎。
default = []
sherpa = ["dep:sherpa-onnx", "dep:audiopus", "dep:rubato"]

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.44.2", features = ["full"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"
anyhow = "1.0.98"
thiserror = "1.0.69"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.11.0", features = ["v4"] }
futures-util = "0.3.31"
tower-http = { version = "0.6", features = ["fs"] }

# 仅在 sherpa feature 下引入（需要网络下载原生库 + 系统 libopus）
sherpa-onnx = { version = "1.13.8", optional = true }
audiopus = { version = "0.2", optional = true }
rubato = { version = "0.15", optional = true }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
httpdate = "1.0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "0.26"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"   # N5105 上平衡编译时间与运行性能

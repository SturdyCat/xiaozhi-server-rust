[package]
name = "xiaozhi-server-rust"
version = "0.1.0"
edition = "2021"
description = "本地 ASR/TTS (sherpa-onnx) + 远程 LLM 的 xiaozhi-esp32 语音服务端"
license = "MIT"

[features]
# 默认构建就是干净的通用服务底座：不装配任何设备/业务插件。
# 业务插件必须显式启用对应 feature，不能通过默认构建隐式进入底座。
default = []
# 当前仓库内置的 native 插件集合，仅用于需要 EchoMuse/Tuya 等原生插件的发行构建。
# 通用底座不启用它；后续独立 WASM 插件也不依赖此集合。
native-plugins = ["echomuse-plugin", "tuya-plugin"]
echomuse-plugin = [
    "dep:rupnp",
    "dep:symphonia",
    "dep:symphonia-core",
    "dep:symphonia-bundle-flac",
    "dep:symphonia-bundle-mp3",
    "dep:symphonia-codec-aac",
    "dep:symphonia-codec-adpcm",
    "dep:symphonia-codec-pcm",
    "dep:symphonia-codec-vorbis",
    "dep:symphonia-format-isomp4",
    "dep:symphonia-format-mkv",
    "dep:symphonia-format-ogg",
    "dep:symphonia-format-riff",
    "dep:symphonia-metadata",
    "dep:zip",
]
tuya-plugin = ["dep:rustuya"]
sherpa = ["dep:sherpa-onnx", "dep:audiopus"]
# TinyBERT 意图分类（技能级联第二级的语义模型实现）：需要 ONNX 运行时 + HF tokenizers。
# ort 用 load-dynamic：运行时 dlopen libonnxruntime（镜像内 ORT_DYLIB_PATH 指路），
# 不静态链 onnxruntime/onnx——否则与 sherpa-onnx-sys 的静态 onnx 对象符号重复，链接失败。
# 仅类型检查用 `DOCS_RS=1 cargo check --features nlu`；真实推理需模型文件（见 config.example.toml [nlu]）。
nlu = ["dep:ort", "dep:tokenizers"]
# ESPHome Native API 适配器（仅随 EchoMuse native 插件显式装载）。
esp_home = ["dep:esphome-native-api", "dep:noise-protocol", "dep:noise-rust-crypto", "echomuse-plugin"]
# WASM 插件平台（方案 v4 / docs/designs/wasm-plugin-platform.md）：wasmtime 宿主 + WIT 契约
# （server/wit/plugin.wit）+ 扩展点解析/回退 + waterfall 事件内核。默认关闭：不加该 feature
# 时零依赖、零行为变化；Docker 部署镜像启用。
# 精选 feature 子集（非 default）：不需要 async/cranelift 之外的引擎、cache、GC、threads。
# 48.x 线：rustc 下限 1.95，本仓库工具链满足；50.x 尚年轻，暂不追新。
wasm-plugins = ["dep:wasmtime"]
[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.44.2", features = ["full"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"
anyhow = "1.0.98"
thiserror = "1.0.69"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# 日志时间戳本地化（app::logtime）：控制台 fmt 层与 /api/logs 日志流共用的唯一时间出口
chrono = { version = "0.4.20", default-features = false, features = ["clock"] }
uuid = { version = "1.11.0", features = ["v4"] }
# 宿主随机源（WIT host-core.random）：插件密码学 nonce/IV/临时密钥的唯一熵源。
getrandom = "0.3.4"
futures-util = "0.3.31"
tower-http = { version = "0.6", features = ["fs"] }
# 通用管理面发现（_xiaozhi-admin._tcp），与设备插件无关。
mdns-sd = "0.11"
# DLNA/UPnP 媒体服务器接入：SSDP 发现（多网卡接口枚举、正确 M-SEARCH 收发）与设备
# 描述/SOAP 动作交给 rupnp（成熟实现，内部 ssdp-client + roxmltree + hyper）；本 crate
# 只做 DIDL 解析（内置极简 scanner）与音频解码推流。自研 SSDP 只查 MediaServer:1 单条
# ST 会漏掉只声明 :2/:3 的服务器，且组播不枚举接口——这是"扫描无效"的根因。
rupnp = { version = "=3.0.0", optional = true }
# DLNA 音频解码：symphonia 把常见格式（mp3/flac/wav/aac/m4a/ogg…）解码到 PCM，再统一
# 重采样 48k mono 经既有音乐通道推流。XML（DIDL）用内置极简 scanner 解析。
# 全家族精确钉 0.5.4：顶层 "0.5" 的 caret 会把子 crate（symphonia-core 等）解析到
# 破坏性改版的 0.5.5（Probe::format 取代 probe()、audio planes/frames 签名全变），
# 子 crate 与顶层 feature 转发必须同版本，否则编译失败。
symphonia = { version = "=0.5.4", optional = true }
symphonia-core = { version = "=0.5.4", optional = true }
symphonia-bundle-flac = { version = "=0.5.4", optional = true }
symphonia-bundle-mp3 = { version = "=0.5.4", optional = true }
symphonia-codec-aac = { version = "=0.5.4", optional = true }
symphonia-codec-adpcm = { version = "=0.5.4", optional = true }
symphonia-codec-pcm = { version = "=0.5.4", optional = true }
symphonia-codec-vorbis = { version = "=0.5.4", optional = true }
symphonia-format-isomp4 = { version = "=0.5.4", optional = true }
symphonia-format-mkv = { version = "=0.5.4", optional = true }
symphonia-format-ogg = { version = "=0.5.4", optional = true }
symphonia-format-riff = { version = "=0.5.4", optional = true }
symphonia-metadata = { version = "=0.5.4", optional = true }

# 监听层（src/serve.rs 的手动 accept loop）：axum::serve 不暴露 per-connection socket
# 选项，而 TCP keepalive 必须逐连接设置——设备拔电不发 FIN/RST，连接半开挂着，tokio 的
# read 永远 pending，EchoMuse 的 hub 条目永不摘除（管理台"断电仍在线"的根因）。四个 crate
# 都已在依赖树中（hyper/hyper-util/tower 经 axum、socket2 经 tokio），不新增编译单元。
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
socket2 = { version = "0.5", features = ["all"] }
tower = "0.5"

# 仅在 sherpa feature 下引入（需要网络下载原生库 + 系统 libopus）
sherpa-onnx = { version = "1.13.8", optional = true }
audiopus = { version = "0.2", optional = true }

# 仅在 esp_home feature 下引入：ESPHome Native API 协议（protobuf + noise_psk 加密），
# 托管 Hello/DeviceInfo/Ping 握手与加密；我们只补「实体列表 + 状态应答」（该 crate 的
# 高层 EspHomeServer 在 v3.0.0 仍是空壳，见 src/device/esp_home/server.rs 模块文档）。
esphome-native-api = { version = "3.0.0", optional = true }
# 仅在 esp_home feature + 测试下作为 **独立参考实现**：S3t 的 esphome.official noise
# 握手对拍（noise-protocol 双角色 / noise-rust-crypto 原语）。生产路径不引用它们——
# 插件的 guest 侧自持有等价的纯 Rust 密码学栈（plugins-src/esphome/src/noise_crypto.rs）。
noise-protocol = { version = "0.2.1", optional = true }
noise-rust-crypto = { version = "0.6.2", optional = true }

# 仅在 nlu feature 下引入（ONNX Runtime 动态库 + 分词器）
# 精确钉 rc.10：caret 会被锁到 rc.14（要求 ONNX Runtime >=1.31），与镜像内 1.22.1 dylib 不配对
ort = { version = "=2.0.0-rc.10", optional = true, features = ["load-dynamic"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

# 仅在 wasm-plugins feature 下引入：WASM Component Model 宿主。
# feature 子集说明见 [features].wasm-plugins；component-model 是 bindgen! 与组件装载的前提。
wasmtime = { version = "48", optional = true, default-features = false, features = [
    "anyhow",
    "backtrace",
    "component-model",
    "cranelift",
    "demangle",
    "parallel-compilation",
    "runtime",
    "std",
] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
# WASM artifact attestation：Ed25519 detached signature verification（默认关闭，配置公钥后启用）。
ring = "0.17.14"
httpdate = "1.0.3"
rustls = { version = "0.23.18", default-features = false, features = ["std", "ring"] }
webpki-roots = "0.26"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Tuya IoT 设备集成（`[tuya]`）：局域网发现（UDP 6666/6667/7000）+ TCP 6668 控制，
# 协议 3.1–3.5 + device22（含 3.4/3.5 会话密钥握手）由库吸收。只用 **async facade**
#（`rustuya::Device`/`DeviceBuilder`/`Scanner`）——`sync::Device` 在 tokio runtime 内
# 会 panic（blocking_send），服务端一律禁用（见 device/tuya/lan.rs 模块注释）。
# 精确钉版（=0.3.0）：涂鸦局域网协议实现版本敏感（3.4/3.5 会话握手），禁 caret 漂移。
rustuya = { version = "=0.3.0", optional = true }

# 仅用于从官方钉版的 onnxruntime-android AAR（zip 容器）里解出 armv7 的
# libonnxruntime.so（EchoMuse 设备语音门 dlopen 的运行时）。只开 deflate、
# 关掉加密/其它压缩/时间特性，把依赖树压到最小。
zip = { version = "4", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
# 仅测试用：`esphome-native-api` 内部用 `log` 打协议日志（握手/读取循环终止原因），
# 而主程序用 tracing。测试里装一个 env_logger 才能看到 crate 的真实错误，
# 否则 `rx` 莫名 Closed 时只能看到客户端侧的 `UnexpectedEof`。
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"   # N5105 上平衡编译时间与运行性能

# xiaozhi-server-rust 配置样例
# 复制为 config.toml 并按需修改；或使用环境变量 XIAOZHI_CONFIG 指向本文件。

[server]
# 监听端口：服务器永远监听 0.0.0.0，仅端口可配（外部可达性由端口映射/防火墙决定）
port = 8000
# Bearer token；为空字符串表示不校验 Authorization 头
expected_token = ""
# tokio 异步运行时 worker 线程数（默认 2）：避免占满 4 核小主机，给其他服务留余量
worker_threads = 2
# 管理页面（h5App 的 Kuikly Web 构建产物）目录；server 在 / 静态托管。
# 默认相对 server/ 指向上级 client/apps/h5App/web（:apps:h5App:publishWeb 产物）；
# Docker 部署无需修改——镜像内置 XIAOZHI_ADMIN_DIR=/app/web 环境变量覆盖。
admin_dir = "../client/apps/h5App/web"

[audio]
# 服务器下行（TTS）采样率，写入服务器 hello，设备据此解码播放。
# 设备上行默认 16k，跟随设备 hello 的 audio_params。
downlink_sample_rate = 24000
downlink_frame_duration_ms = 60
channels = 1
# 下行二进制协议版本（1/2/3）；建议先用 1，真机验证后再切 2/3。
binary_protocol_version = 1
# 下行抖动缓冲提前量（毫秒）：下发时间表整体比实时提前此量，设备解码队列
# 常备约此长度的音频存货，吸收网络/调度抖动，消除偶发小卡顿。
# 上限 20 包（60ms 帧 ≈ 1200ms），默认 240（4 帧）；调大会增加打断响应延迟。
downlink_lead_ms = 240

[asr]
# ASR 恒为 SenseVoice INT8（sherpa-onnx 离线识别），无 mock。
model = "/data/models/SenseVoiceSmall/model.int8.onnx"
tokens = "/data/models/SenseVoiceSmall/tokens.txt"
language = "auto"
use_itn = true
# 识别线程数（默认 2）：与 TTS/VAD 错峰，避免占满 4 核小主机
num_threads = 2
provider = "cpu"

[vad]
model = "/data/models/silero_vad.onnx"
threshold = 0.5
min_silence_duration = 0.25
min_speech_duration = 0.25

[tts]
# 引擎分两类：本地模型（离线）/ 远程服务（在线）。
#   本地：backend = "sherpa"（Kokoro INT8，用下方 model/voices/tokens/... 路径字段）；
#   远程：backend = "<服务商 id>"（如 "xfyun"，用对应 [tts.xfyun] 凭据段）。
# 改后保存即热切换：新会话/测试台 tts_test 立即用新引擎（无需重启）。
# 未来更多远程供应商 = 新增 [tts.<id>] 凭据段 + backend 填对应 id。
backend = "sherpa"
model = "/data/models/Kokoro/model.int8.onnx"
voices = "/data/models/Kokoro/voices.bin"
tokens = "/data/models/Kokoro/tokens.txt"
data_dir = "/data/models/Kokoro/espeak-ng-data"
dict_dir = "/data/models/Kokoro/dict"
lexicon = "/data/models/Kokoro/lexicon-us-en.txt,/data/models/Kokoro/lexicon-zh.txt"
# 合成语言（建模时固定；"zh"/"en"）。管理页面切换其他语言时按需自动构建对应引擎。
lang = "zh"
speaker = 0
speed = 1.0
# 合成线程数（默认 4）：用满计算预算。旧值 1（「与 ASR 错峰」）实测让合成只剩
# 1/4 算力（CPU 25%、4 个字 8+ 秒、10 个字 20 秒）——流水线 ASR→LLM→TTS 本身串行，
# 不存在抢占。容器部署（docker-compose.yml）已设 cpus: "3.5" 配额（留 0.5 核给宿主机），
# 4 个合成线程在 3.5 核配额内调度；如需更保守可下调到 3。
num_threads = 4
# TTS 结果缓存条目数（默认 256，0 = 关闭）：按句缓存**已编码**的下行 Opus 帧
# （键 = 引擎签名+音色+语速+下行采样率/帧长+文本，跨会话共享）。命中的句子
# 零合成/零编码延迟，直接按实时节奏下发——高频短句（"好的""我在"）TTFA 从
# 合成耗时降到一次预充突发（≈[audio].downlink_lead_ms）。
cache_entries = 256

# 科大讯飞在线合成（backend = "xfyun" 时生效）：
# 在讯飞开放平台（xfyun.cn）创建应用 → 开通「在线语音合成（流式版）」→ 复制 APPID/APIKey/APISecret 三件密钥。
# voice 为发音人（vcn），如 xiaoyan（默认女声）；更多音色在控制台「发音人」处选择后填入。
[tts.xfyun]
app_id = ""
api_key = ""
api_secret = ""
voice = "xiaoyan"
# 发音人：AIUI 主动合成 API（wss://aiui.xf-yun.com/v3/aiint/sos，scene=IFLYTEK.tts）支持
# 普通 x2_* / 超拟人 x4_* / 极速超拟人 x5_/x6_ 全系。音色列表由服务端**真实探测**生成
# （GET /api/tts/voices；macApp 配置卡「探测音色目录」触发），只列出实际可用的音色。

[llm]
# LLM 恒为 OpenAI 兼容 Responses API（HTTP），无 mock。
# OpenAI **Responses API** 端点（POST /v1/responses，非 chat/completions）；
# 请求体为 model/instructions/input[]/stream，SSE 流式见下方 stream。
api_base = "https://api.example.com/v1/responses"
api_key = "YOUR_API_KEY"
model = "gpt-4o"
system_prompt = "你是一个有用且简洁的中文语音助手。"
max_history = 10
temperature = 0.7
# SSE 流式（逐 token 返回，配合按句下发降低首字延迟）；false 退回整段解析
stream = true

# ===== AIUI 全链路（极速超拟人链路）：启用后设备流水线切换为 VAD 切段 → AIUI 云端闭环
#       （识别 + 大模型 + 合成一体，发音人目录见 AIUI 文档 3.9），本地 ASR/LLM/TTS 引擎闲置。
#       ⚠️ 需在 AIUI 平台（aiui.xfyun.cn）开通极速超拟人服务；对话上下文按连接保留。
# [aiui]
# enabled = true
# appid = "your_appid"
# api_key = "your_api_key"
# api_secret = "your_api_secret"
# scene = "main"                       # 平台上 appid 下的情景模式（main_box 为测试环境）
# sn_prefix = "xiaozhi"                # 设备标识前缀（云端个性化绑定）
# voice = "x6_dongmanshaonv_pro"       # 发音人（极速超拟人目录）
# speed = 50                           # 语速/音量/音调（0~100，50 常速）
# volume = 50
# pitch = 50
# prompt = ""                          # 自定义人设（可空）

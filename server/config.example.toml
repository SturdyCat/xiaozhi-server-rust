# xiaozhi-server-rust 配置字段样例（参考文档，不再作为运行时配置文件）。
# 配置真源是 SQLite 配置库（XIAOZHI_CONFIG_DB → --config-db → /data/data.db）：
# 空库以内置默认启动并落库，改配置走管理页 / PUT /api/config（写库）。
# 本文件仅 enumerates 全部可配字段及默认值/注释，供初始化与查阅。
#
# 默认值口径：唤醒问候语 / 结束会话目录 / 配置技能目录 / 人格档案 / 记忆 / EchoMuse 入口 / LLM 对话
# 这些「标准行为」默认 enabled = true —— 装机零配置即可用，不想要可在管理页显式关闭。
# 存量配置库在启动时按 defaults_version 自动对齐：仍是旧默认的项跟随新默认，用户显式
# 改过的项原样保留（见 server/src/config/defaults.rs）。

[server]
# 监听端口：服务器永远监听 0.0.0.0，仅端口可配（外部可达性由端口映射/防火墙决定）
port = 8000
# Bearer token；为空字符串表示不校验 Authorization 头
expected_token = ""
# tokio 异步运行时 worker 线程数（默认 2）：避免占满 4 核小主机，给其他服务留余量
worker_threads = 2
# 管理页面（admin-web Vite 构建产物）目录；server 在 / 静态托管。
# 默认相对 server/ 指向上级 client/admin-web/dist（pnpm --dir client/admin-web build 产物）；
# Docker 部署无需修改——镜像内置 XIAOZHI_ADMIN_DIR=/app/web 环境变量覆盖。
# ⚠️ admin_dir 是 SQLite 配置库可写字段（plugins/registry/projection.rs）：改这里或改代码
#    默认值都只对「空库首次启动落库」生效，**不影响存量实例已持久化的库内值**。
#    XIAOZHI_ADMIN_DIR 环境变量最后覆盖且优先、不写回（GET /api/config 仍展示库内原值）；
#    切换存量实例请用管理页 PUT /api/config 改 server.admin_dir 并重启，或显式设置该环境变量。
admin_dir = "../client/admin-web/dist"

[audio]
# 服务器下行（TTS）采样率，写入服务器 hello，设备据此解码播放。
# 设备上行默认 16k，跟随设备 hello 的 audio_params。
# 只允许 16000 / 24000 / 48000（其它值会被 normalize 回落 24000 并告警：
# 非法率会让 Opus 编码器建不起来、每句音频被静默丢弃）。
# 24000 是推荐锚点：Kokoro 原生 24k（零重采样）、Opus 原生支持。
# 注意 AIUI（讯飞）实测只回 16k、且忽略请求里的 sample_rate：用它时选 24000 意味着
# 每句多做一次 1.5× 升采样，选 16000 则零重采样（音质更好、带宽减半）。
# EchoMuse 例外：下行固定 48k（设备 DAC 48k 且不重采样，协议常量），
# 由服务端从 TTS 真实率升采样（16k→48k 为 3×，24k→48k 为 2×）。
downlink_sample_rate = 24000
downlink_frame_duration_ms = 60
channels = 1
# 下行二进制协议版本（1/2/3）；建议先用 1，真机验证后再切 2/3。
binary_protocol_version = 1
# 下行抖动缓冲提前量（毫秒）：下发时间表整体比实时提前此量，设备解码队列
# 常备约此长度的音频存货，吸收网络/调度抖动 + 上游 LLM 出句/TTS 合成的停顿
# ——这就是"前面播放流畅、后续断断续续"的解药，缓冲越深越耐受上游变慢。
# 安全上限 = (downlink_queue_packets − 2) × 帧长（默认 (20−2)×60 = 1080ms；
# 超限开局即静默丢包，服务器会把超限值收敛到上限并告警）。默认 1000 ≈ 设备端极限。
# ⚠️ 代价：`tts stop` 不清队列，设备会把已缓存的 ~lead 音频播完才进入聆听
# ——提前量越大，打断后"停口"越晚（240ms≈一个字，1000ms≈三个字）。
# ⛔ 不要置 0：等于关闭抖动缓冲，设备解码队列无预充，长回复必然频繁触发断音警告
# （服务器会在启动时把 0 纠正回默认值）。在意打断延迟请调小（如 240ms）而非置 0。
downlink_lead_ms = 1000
# 设备解码队列**包数**：必须与固件一致！
#   固件 main/audio/audio_service.h：MAX_DECODE_PACKETS_IN_QUEUE
#   = 1200 / OPUS_FRAME_DURATION_MS（官方 60ms 帧 → 20 包）。
# ⚠️ 单位是包不是毫秒：能装多少音频 = 包数 × 帧长（20×60ms=1.2s；帧长 40ms 时只有 0.8s）。
# 想给长回复更多缓冲（>1.1s）时，服务端无法凭空造出来——必须：
#   ① 固件改大队列（例：4000 / OPUS_FRAME_DURATION_MS = 66 包）→ 重刷设备
#   ② 本项改为 66 → ③ 再调大 downlink_lead_ms（上限随本项 + 帧长自动放宽）
downlink_queue_packets = 20
# ── 服务器侧下行缓冲（用服务器内存换下行连续性；重启生效）──────────────────────
# 完整链路是**三段缓冲**，各管一件事（勿互相替代）：
#   TTS 接口 ─流式下载─▶ 下载缓冲(PCM, 秒级预算) ─重采样+Opus─▶ 水库(Opus, 多秒) ─▶ 实时节拍 ─▶ ESP
# 设备解码队列只有 ~1.2s（上面两项），而上游常常慢于实时：LLM 逐句吐字、在线 TTS
# 每次调用都要重新握手/等首片。任何一种只要让"音频到达速率 < 播放消耗速率"持续超过
# ~1s，设备队列就被抽干 → 长回复"从中间某句起断断续续"。
# 水库把**已经合成好的音频**（已编码 Opus 帧）多备几秒在服务器内存里，发送端从水库
# 取帧下发 → 上游停顿 ≤ 水库水位 + 设备队列 时，听感全程连续。
# 内存代价：约 2KB/s，30s ≈ 60KB/会话（可忽略）；真正的代价是下面的起跑延迟。
# 0 = 关闭水库（退化为逐帧直通，只有节流保护）。
# ⚠️ 水库只能"备住已经合成出来的音频"。上游**平均**慢于实时时缺口是**累积**的，
#    要整轮不断音得先攒出累计缺口：所需缓冲 ≈ (1/生产速率 − 1) × 音频总长
#    （0.64× 生产 + 80s 音频 → 约 45s）。所以默认 30s 解决的是"上游**间歇**停顿"；
#    上游**持续**慢只有提高 [tts].speed（音频变短）或换更快的 LLM/TTS 才是根治——
#    每轮日志的"本轮吞吐：音频 Xms / 播放窗口 Yms ≈ N× 实时"就是判据（N<1 即持续慢）。
downlink_buffer_ms = 30000
# 下载缓冲预算（毫秒）：**由 downlink_buffer_ms 派生并夹在 [1000, 10000]**，无需单独配置。
# 语义：TTS 流下载的 PCM 积压达到预算就**暂停下载**，编码入水库后立刻恢复——上游能多快
# 就多快，但积压永远 ≤ 预算（PCM f32 是 64KB/s @16kHz，比水库里的 Opus 贵 ~30 倍，
# 所以不能与水库等深；10s 上限 ≈ 640KB/会话）。见 src/app/prefetch.rs。
# 起跑闸（毫秒）：本轮首帧下发前先等水库攒够这么多音频再开播。
# 立刻开播会把上游缺口摊成一整轮的断续（听感最差）；先攒一段再播，缺口被水库吸收，
# 代价是一次性起跑等待（默认 1.5s；生产端已收工的短回复会立即放行，不白等）。
# 上游持续慢于实时且**想要整轮不断音**时，把它调到"所需缓冲"量级（代价是开口更晚）。
# 0 = 关闭（首帧一到就发，TTFA 最小）。
downlink_buffer_start_ms = 1500
# 起跑闸最长等待（毫秒）：上游持续慢于实时时不把首帧无限期拖住；到点即以当前水位
# 起跑，日志会写明"上游供数慢于实时"。
downlink_buffer_start_max_ms = 4000

# New sessions only. Existing sessions keep their pinned mode/gate.
[playback]
# interactive preserves the legacy [audio] gate; announcement uses the bounded gate below.
mode = "interactive"
announcement_start_ms = 5000
announcement_start_max_ms = 10000

[asr]
# 引擎选择（P4 约定：engine = 实现 id，可选 sensevoice）。改后需重启 server。
engine = "sensevoice"
# ASR 恒为 SenseVoice INT8（sherpa-onnx 离线识别），无 mock。
model = "/data/models/SenseVoiceSmall/model.int8.onnx"
tokens = "/data/models/SenseVoiceSmall/tokens.txt"
language = "auto"
use_itn = true
# 识别线程数（默认 2）：与 TTS/VAD 错峰，避免占满 4 核小主机
num_threads = 2
provider = "cpu"
# 并发推理路上限（默认 1，重启生效）：跨会话的 ASR 闸门——多设备同时说话时排队，
# 而不是把 CPU 压垮。本地引擎每路占 num_threads 线程（1 路 × 2 线程 = 恰等于线程预算）；
# 算力富余（换了更大的主机）可放宽。
max_concurrent = 1

[vad]
# 引擎选择（P4 约定，可选 silero）；阈值等参数对新会话生效。
engine = "silero"
model = "/data/models/silero_vad.onnx"
threshold = 0.5
min_silence_duration = 0.25
min_speech_duration = 0.25

[tts]
# ===== 配置约定（P4）：engine 选实现 + 私有参数进 [tts.<id>] 子段 =====
#   engine = "kokoro"  → 本地 Kokoro INT8（离线），参数见下方 [tts.kokoro]
#   engine = "xfyun"   → 讯飞在线合成（在线），凭据见 [tts.xfyun]
# 旧写法（backend = "sherpa" + 把 model/voices/... 直接写在 [tts] 下）**仍然可读**：
# 加载时自动搬到 [tts.kokoro]，保存一次即写成新结构。
# 改后保存即热切换：新会话/测试台 tts_test 立即用新引擎（无需重启）。
# 新增供应商 = 新实现文件 + 注册表加 1 条描述符（含字段/签名/构建），不再改工厂分发。
engine = "kokoro"

# 跨实现通用项（所有引擎共用）：
speaker = 0
speed = 1.0
# TTS 结果缓存条目数（默认 256，0 = 关闭）：按句缓存**已编码**的下行 Opus 帧
# （键 = 引擎签名+音色+语速+下行采样率/帧长+文本，跨会话共享）。命中的句子
# 零合成/零编码延迟，直接按实时节奏下发——高频短句（"好的""我在"）TTFA 从
# 合成耗时降到一次预充突发（≈[audio].downlink_lead_ms）。
cache_entries = 256
# 并发合成路上限（默认 1，随 TTS 热切换对账、新会话生效）：跨会话的 TTS 闸门。
# 本地引擎每路占 num_threads 线程（1 路 × 4 线程 = 恰等于线程预算）；
# 讯飞在线是网络型引擎（不吃本地 CPU），多设备部署建议放宽到 2~4。
max_concurrent = 1

[tts.kokoro]
model = "/data/models/Kokoro/model.int8.onnx"
voices = "/data/models/Kokoro/voices.bin"
tokens = "/data/models/Kokoro/tokens.txt"
data_dir = "/data/models/Kokoro/espeak-ng-data"
dict_dir = "/data/models/Kokoro/dict"
lexicon = "/data/models/Kokoro/lexicon-us-en.txt,/data/models/Kokoro/lexicon-zh.txt"
# 合成语言（建模时固定；"zh"/"en"）。管理页面切换其他语言时按需自动构建对应引擎。
lang = "zh"
# 合成线程数（默认 4）：用满计算预算。旧值 1（「与 ASR 错峰」）实测让合成只剩
# 1/4 算力（CPU 25%、4 个字 8+ 秒、10 个字 20 秒）——流水线 ASR→LLM→TTS 本身串行，
# 不存在抢占。容器部署（docker-compose.yml）已设 cpus: "3.5" 配额（留 0.5 核给宿主机），
# 4 个合成线程在 3.5 核配额内调度；如需更保守可下调到 3。
num_threads = 4

# 科大讯飞在线合成（engine = "xfyun" 时生效）：
# 在讯飞开放平台（xfyun.cn）创建应用 → 开通「在线语音合成（流式版）」→ 复制 APPID/APIKey/APISecret 三件密钥。
# voice 为发音人（vcn），如 xiaoyan（默认女声）；更多音色在控制台「发音人」处选择后填入。
[tts.xfyun]
app_id = ""
api_key = ""
api_secret = ""
voice = "xiaoyan"
# 发音人：AIUI 主动合成 API（wss://aiui.xf-yun.com/v3/aiint/sos，scene=IFLYTEK.tts）支持
# 普通 x2_* / 超拟人 x4_* / 极速超拟人 x5_/x6_ 全系。音色列表由服务端**真实探测**生成
# （GET /api/tts/voices；macApp 配置卡「探测音色目录」触发），只列出实际可用的音色。

[llm]
# 引擎选择（P4 约定，可选 openai）；改后对新会话生效。
engine = "openai"
# 总开关（默认 true，新会话生效）：false = 回声模式——已启模型识别的技能（command/nlu）照常，
# 未命中时不调云端 LLM，把 ASR 文本原样 TTS 回放（测试 ASR→TTS 链路用；不写历史/记忆）。
enabled = true
# LLM 恒为 OpenAI 兼容 Responses API（HTTP），无 mock。
# OpenAI **Responses API** 端点（POST /v1/responses，非 chat/completions）；
# 请求体为 model/instructions/input[]/stream，SSE 流式见下方 stream。
api_base = "https://api.example.com/v1/responses"
api_key = "YOUR_API_KEY"
model = "gpt-4o"
system_prompt = "你是一个有用且简洁的中文语音助手。"
max_history = 10
temperature = 0.7
# SSE 流式（逐 token 返回，配合按句下发降低首字延迟）；false 退回整段解析
stream = true
# 残句定时出句（毫秒，默认 1500，新会话生效）：LLM 流距上一 token 静默 ≥ 此值且
# 残句非空时，先把残句送 TTS——思考型模型的长停顿不再无限等标点或 50 字硬切，
# 首字音频延迟有上界。调小 → 首字更稳但残句更碎（中文 TTS 对碎片句韵律可接受）；
# 调大 → 行为趋近现状；0 = 关闭。上限 60000。
sentence_flush_ms = 1500

# ===== LLM 主备切换（可选）：主用额度/限流/故障时自动换备用端点 =====
# 机制对齐 hermes-agent 的 fallback providers：
#   · 触发：限流(429)/5xx/连接/超时/空回复在主用**重试预算耗尽后**切换；
#     鉴权/配额(401/402/403)立即切换；参数类 4xx（model 写错等）不切。
#   · 冷藏：429 带 Retry-After → 主用冷藏到恢复时刻；没带 → 指数退避 60s→4h。
#     冷藏期内每轮直接走备用，不再白撞主用。5xx/断连等瞬时失败不冷藏（下一轮先回主用）。
#   · 已吐过文本（用户已听到前半句）绝不切换，避免重复播报。
#   · 生效：保存后**新会话**生效；api_key 同样密钥打码（GET 不回传明文）。
[llm.fallback]
# 限流恢复窗口小于该秒数时不切备用（默认 0 = 恒切换；hermes min_switch_reset_seconds）。
min_switch_reset_seconds = 0
# 备用链，按序尝试（可多条）。api_base 与 model 必填，缺一条启动/保存直接报错。
# [[llm.fallback.providers]]
# api_base = "https://backup.example.com/v1/responses"
# api_key = "YOUR_BACKUP_API_KEY"
# model = "gpt-4o-mini"

# ===== 结束会话技能：与其他技能共用真实模型，不再直接匹配关键词 =====
# keywords 仅是 end_session 的训练例句与目录来源；变更后须重新训练并验收。
# match_mode/max_chars 仅兼容读取，不再参与识别，不能绕过模型执行。
[command]
enabled = true
keywords = ["退下", "闭嘴", "关闭"]
reply = "好的，我先退下了。"          # 模型接受后先告别，再 MCP stop；旧设备兼容关闭当前会话。

# ===== NLU：真实模型唯一识别 + 配置驱动技能 =====
# 不存在关键词、模板规则、启发式评分或 LLM 工具重新选择技能的回退。
# bert_enabled=false 时只允许普通聊天；启用但缺文件/加载失败则明确报错，不伪造分类。
# other、低分、未知标签与未进入有效目录的技能均不得执行；缺参数明确澄清。
# templates 是训练语料，运行时只为模型已接受的同一技能抽取槽位，不能靠模板选技能。
# 保存技能 -> 以保存态版本构建 -> 独立候选测试 -> 明确采用并保存启用。
# 构建和分类测试均不执行步骤，不代表提醒已创建、到期已投递或设备已播报。
# 初始11项时钟技能来自 plugins/nlu/defaults.json；显式 intents=[]/slots=[] 表示清空。
# 存量同名 reply 技能原样保留，不自动升级为有副作用的 plan。
# GET /api/skills/catalog 读取保存态有效清单，GET /api/skills/capabilities 读取稳定能力。
[nlu]
enabled = true                      # 配置技能目录开关；command 目录开关独立，识别模型共用。
bert_enabled = false                # 唯一分类器开关，需支持 nlu feature 的服务端与有效模型文件。
bert_model = ""                     # 采用候选后写入受管 ONNX 模型路径。
bert_vocab = ""                     # 配套 HuggingFace tokenizer.json，不是 vocab.txt。
bert_labels = ""                    # 每行一个标签，顺序与输出 logits 一致。
bert_threshold = 0.75
bert_num_threads = 1
bert_max_len = 64
bert_label_map = {}
# 旧 model_threshold/model_margin 仅兼容读取，已无识别效果，不再展示为调优参数。
# 稳定 Rust 能力 + 配置条件/步骤；新增技能不改 Rust，新增标签仍需训练验收。
# 条件 kind：slot_present{slot}、slot_equals{slot,value}、device_kind{value}。
# 步骤 api：tasks.create/list/get/cancel、messages.send、devices.call、sessions.end、replies.say。
# args 按 JSON 树替换 {{slots.name}} / {{ctx.device_id}} / {{ctx.session_id}}；API/工具名必须是字面量。
# replies.say.text 可引用已执行的前序 tasks.create/list/cancel 真实结果，如 {{steps.0.speech}}；
# 不可用于其他参数，不可引用未来步骤。action.reply 保持空，避免与真实结果重复应答。
# plan 最多 16 条条件/16 步/32768 字节；不执行任意脚本、Shell 或下载代码。
# tasks.create 的 after/at/interval/daily/hourly/workdays/weekly/monthly/yearly 九择一。
# 默认时钟使用北京时间 Asia/Shanghai；底层也接受 UTC，不支持其他时区或猜测夏令时。
# at 支持今天/明天/后天/大后天与上午/下午/晚上；未说日期的钟点取下一次到达并回读完整日期。
# 显式今天但已过去的时刻不能默默顺延；模糊或无效参数明确澄清，不伪造创建成功。
# hourly 是每小时的 0..59 分钟（可写20或“20分”）；workdays 是钟点，仅周一至周五，非法定节假日日历。
# weekly={weekday=1..7,time=钟点}；monthly={day=1..31,time=钟点}；yearly={month=1..12,day=1..31,time=钟点}。
# 每月31日/每年2月29日遇不存在的日期跳过，绝不夹到月底；2月30日等永不存在日期拒绝。
# tasks.cancel 的 task_id 或 text 恰选一个；text 精确同名多条时先澄清，不批量删除。
# 到期投递先短铃声再读文案；调度完成/音频已提交都不等于设备已实际播报。
intents = [
  { name = "reminder_countdown", templates = ["{delay}后提醒我{task}", "过{delay}提醒我{task}", "{delay}之后提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", after = "{{slots.delay}}", timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_schedule", templates = ["{time}提醒我{task}", "在{time}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", at = "{{slots.time}}", timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_repeat", templates = ["每隔{interval}提醒我{task}", "间隔{interval}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", interval = "{{slots.interval}}", timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_daily", templates = ["每天{daily_time}提醒我{task}", "每日{daily_time}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", daily = "{{slots.daily_time}}", timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_workdays", templates = ["每个工作日{daily_time}提醒我{task}", "每工作日{daily_time}提醒我{task}", "工作日{daily_time}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", workdays = "{{slots.daily_time}}", timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_weekly", templates = ["每周{weekday}的{daily_time}提醒我{task}", "每周{weekday}{daily_time}提醒我{task}", "每星期{weekday}的{daily_time}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", weekly = { weekday = "{{slots.weekday}}", time = "{{slots.daily_time}}" }, timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_monthly", templates = ["每月{day}日{daily_time}提醒我{task}", "每月{day}号{daily_time}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", monthly = { day = "{{slots.day}}", time = "{{slots.daily_time}}" }, timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_yearly", templates = ["每年{month}月{day}日{daily_time}提醒我{task}", "每年{month}月{day}号{daily_time}提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", yearly = { month = "{{slots.month}}", day = "{{slots.day}}", time = "{{slots.daily_time}}" }, timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_hourly", templates = ["每小时的{minute}分提醒我{task}", "每小时{minute}分提醒我{task}"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.create", args = { text = "{{slots.task}}", hourly = "{{slots.minute}}", timezone = "Asia/Shanghai" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_list", templates = ["查询我的提醒", "我有哪些提醒"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.list", args = {} }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
  { name = "reminder_cancel", templates = ["取消提醒{task}", "取消{task}的提醒"], action = { kind = "plan", reply = "", plan = { conditions = [], steps = [{ api = "tasks.cancel", args = { text = "{{slots.task}}" } }, { api = "replies.say", args = { text = "{{steps.0.speech}}" } }] } } },
]
slots = [
  { name = "delay", values = [], optional = false },
  { name = "time", values = [], optional = false },
  { name = "daily_time", values = [], optional = false },
  { name = "interval", values = [], optional = false },
  { name = "task", values = [], optional = false },
  { name = "weekday", values = ["一", "二", "三", "四", "五", "六", "七", "日", "天", "1", "2", "3", "4", "5", "6", "7"], optional = false },
  { name = "day", values = [], optional = false },
  { name = "month", values = [], optional = false },
  { name = "minute", values = [], optional = false },
]
# 兼容已有 action.kind=reply/end_session/mcp:<固定设备工具名>；不自动替换旧配置。

# ===== 天气预报（NMC 国家气象中心，纯 Rust 复刻）=====
# 默认即可工作，无需改动；仅在需要切换数据源、调超时或缓存时长时调整。
# 仅「国内」出口 IP 才会被写入默认地区（见 geo 定位），未定位时天气必须显式给城市。
[weather]
engine = "nmc"                       # 数据源引擎（当前仅 nmc = 国家气象中心）
source = "https://www.nmc.cn"        # 数据源根地址（纯 Rust 复刻，不 vendoring python 脚本）
timeout_secs = 8                     # 单次请求 connect/总超时（秒）
cache_secs = 600                     # 按站点码缓存天气的 TTL（秒），避免重复打接口
backend = "native"                   # 技能查询后端：native = 内置 reqwest 实现（默认）；
                                     # wasm = weather.official 插件（需 wasm-plugins feature +
                                     # 插件已装载；缺依赖明确报错不静默回退，改后需重启）

[plugins]
enabled = true                       # WASM 插件平台总闸：false = 完全跳过装载与启动引导
require_artifact_pin = false          # 严格完整性 admission：true = 未配置 artifact SHA-256 的产物不装载/不引导
# attestation_public_key = "<base64-ed25519-public-key>" # 配置后每个启用插件都必须有签名

[plugins.entries."weather.official"]
enabled = true                       # 每插件启停（键 = 插件 id；缺省启用——上传落盘即意图）。
                                     # 禁用 = 重启不装载、启动引导跳过；改后需重启
# artifact = "<sha256>"              # 可选内容钉版；摘要不符的落盘产物重启时跳过
# attestation = "<base64-signature>"  # Ed25519 签名，覆盖 artifact 摘要文本
                                     # 上传采用会自动回写真实摘要；缺省兼容旧配置放行

[wakeup]
enabled = true                      # 默认 true = 启用唤醒问候语（不需要可改 false）
greeting = """我在"""                # 设备唤醒（固件上报 listen state=detect；EchoMuse 设备
                                    # 唤醒/按键时服务器代发 detect）时立刻说这句，**跳过 LLM
                                    # 与正常回复**。支持多句：换行分隔，每次唤醒随机选一句
                                    # （greeting = """我在
                                    # 在呢
                                    # 你好呀"""）。建议每句都短（≤10 字）：问候语播放期间
                                    # 上行音频会在缓冲区排队，太长会推迟用户第一句话的处理。
persist = true                      # 把成品音频（裸 24kHz PCM 文件，约 48KB/秒，可直接播放）
                                    # 落盘到 <配置文件目录>/hot-audio/（<哈希>.pcm，无容器无
                                    # 登记表），进程重启后直接读盘复用。
                                    # ⚠️ 需要 [tts].cache_entries > 0（复用经内存缓存承载成品帧）；
                                    # 缓存被关掉时配置校验会拦下并提示怎么改。
                                    # 稳态下每次唤醒零 LLM、零 TTS；换音色会自动重新合成并另存一份。

# ===== EchoMuse 设备入口（Echo Dot 2 刷 emOS 后直连本服务器，无需 Home Assistant）：
#       设备经 mDNS `_emcontroller._tcp` 发现本服务器，走 `/em/control` + `/em/data`
#       双 WebSocket 接入，与 xiaozhi 设备共用同一条 ASR→LLM/技能→TTS 流水线。
#       前置：Dot 需先用 firebreak 解锁并经 EchoMuse 官方向导刷入 emOS（一次性）。
#       ⚠️ 改动本段需**重启**生效。
[echomuse]
engine = "native"                   # native / wasm-policy；旧值 wasm 仍可读，改动需重启
enabled = true                       # 默认 true = 挂载 /em/control、/em/data 路由并广播 mDNS（不用 EchoMuse 设备可改 false）
token = ""                          # 期望的设备 token（`X-Em-Token` 头）；留空 = 不校验。
                                    # 取 Dot 上 EchoMuse 凭据文件里的 token（配对时下发）；
                                    # 生产建议设置——同网段任何设备都能按此协议连进来。
ble_proxy = false                   # true = 开启蓝牙代理：ack 向声明了 ble_connect 的设备回声明
                                    # ble_connect + ble_adverts_data，并在接入时推送
                                    # bleProxyEnabled/bleProxyConnections（每设备 settings 可覆盖，
                                    # 关连接留扫描时对单台 POST settings 即可）。服务器经
                                    # /api/echomuse/devices/{id}/ble/adverts|state 采集广播与
                                    # 槽位/通知事件，经 .../ble/gatt 直驱外围设备读写。
                                    # 无配对/加密（协议规定 Security Request 答不支持）。
plain_port = 8767                   # 控制器专用端口（官方接口对齐）：额外在此端口监听 /em/* 路由，
                                    # mDNS plain_port 也广播它——上游固件 tcp_peer() 只把远端
                                    # 8767/8770 的连接识别为 controller（串口 banner 判据），
                                    # 设备经发现自动拨官方端口。0 = 关闭（仅主端口）；
                                    # 绑定失败自动回退广播主端口；主端口始终继续服务 /em/*。
welcome = "我已连接，喊我的唤醒词或按一下按键就能开始对话。"
                                    # 设备接入欢迎语：register + data 认领、会话建立后立刻说一次
                                    # （与唤醒问候同一预制话术链路，合成一次即落盘 hot-audio/ 的
                                    # 裸 24k PCM 文件免复合成）。留空 = 不说。每次会话建立
                                    #（含断线重连）都会说一遍。
                                    # ⚠️ [echomuse] 段 RestartOnly：改完需重启服务端生效。
# mDNS 广播地址无配置项：启动时动态探测部署机默认出口的局域网 IPv4，部署在哪台
# 机器就广播哪个 IP。docker 容器部署探测到的是容器内网 IP，请改用 host 网络。

# ===== ESPHome Native API 桥（可选模块，默认关闭）：把 Dot 2 暴露成标准 ESPHome 节点，
#       HA / homeCore / 任意 native-api 客户端连上来就能发现并驱动，不必为每个新设备
#       ／新协议在服务端加端点。
#       ⚠️ 需 `cargo build --features esp_home`（或不加该 feature 时本段完全不生效：
#          零依赖、零监听、零行为变化）。
#       ⚠️ 暴露的实体：binary_sensor（在线 / 聆听中 / 思考中 / 播报中 / 静音，均只读）
#          + number（音量 0..127，可写 → 下发 volume_set 给设备）。
#       ⚠️ 静音只有设备上报（mute_state）、协议无 mute_set，故为只读传感器——不做
#          "点了没反应"的假开关。LED / 打断同理（无下发路径），暂不暴露。
#       ⚠️ bluetooth_proxy（Dot 2 当 BLE 代理）：ble_proxy=true **且** [echomuse].ble_proxy=true
#          才向客户端宣告。能力只报真实具备的位（被动扫描 + 主动连接）：
#          配对 / 清缓存 / 描述符读写设备侧没有实现，一律不报、请求时明确回错误；
#          notify 只能转发设备已自动推送的事件流（设备不支持按 handle 订阅）。
#          设计与能力边界见 docs/research/emx-integration-analysis.md §4.1.2 / §4.1.3。
#       ⚠️ 改动本段需**重启**生效。
[esp_home]
enabled = false                     # true = 在 port 上提供 ESPHome Native API（默认关闭）
engine = "native"                   # "native" = 全原生；"wasm-policy" = 桥启动期实体目录放行/改名
                                    # 经 connector.esp-home 策略插件决策（需 wasm-plugins feature
                                    # 且已激活 esphome.official；插件不可用桥不启动，不静默降级）。
                                    # "wasm-session" = 协议面（握手/加密/消息派发/实体应答）也整体
                                    # 迁入 esphome.official 插件（S3v）：加密密钥改由管理台插件
                                    # 配置的 noise_psk（secret 字段）提供，下方 encryption_key
                                    # 不参与协议；与 ble_proxy=true 组合不兼容（启动期显式报错）。
                                    # 旧值 "wasm" 仍可读；改动需重启。
port = 6053                         # ESPHome 官方默认端口；与 [server].port 无关、互不影响
encryption_key = ""                 # noise_psk（base64 的 32 字节，ESPHome 生成的那串）；
                                    # 留空 = 明文，仅限可信局域网。生产建议设置。
device_name = "xiaozhi-dot2"        # 节点名（mDNS 实例名 + <name>.local 主机名前缀）
friendly_name = "EchoMuse Dot 2"    # HA 里显示的名字
model = "EchoMuse Dot 2"            # 上报的型号
manufacturer = "xiaozhi"            # 上报的厂商
suggested_area = ""                 # HA 首次添加时的默认区域（留空 = 不指定）
mdns = true                         # 广播 _esphomelib._tcp 供 HA 自动发现；失败只告警，
                                    # 可用 IP:port 手动添加（容器内探测不到局域网 IP 时常见）
ble_proxy = true                    # 宣告 BLE 代理能力；还需 [echomuse].ble_proxy 也为 true
                                    # 才真正生效——后者才是设备扫描/连接的总闸。

# ===== Tuya IoT 设备集成：涂鸦云只做目录同步（含 local_key），发现与控制纯局域网 =====
#       UDP 6666/6667/7000 发现 + TCP 6668 控制（协议 3.1–3.5 自动协商），断云可用。
#       凭证（IoT 平台 → 云开发项目的 access_id/access_secret）在管理台「涂鸦设备」页
#       录入即可，**全部热生效，无需重启**；access_secret 只写不读（API 永不回显）。
#       设备目录存独立 SQLite <配置库目录>/tuya/devices.db（0600 权限）。
[tuya]
engine = "native"                   # native / wasm-policy；旧值 backend/lan/wasm 仍可读
enabled = true                      # false = /api/tuya/* 统一 404、不轮询不同步
region = "cn"                       # 涂鸦云区域：cn / us / eu / in
access_id = ""                      # 开发者 access_id（留空 = 仅手动同步会报"凭证未配置"）
access_secret = ""                  # 开发者 access_secret（只写不读）
sync_interval_secs = 86400          # 定时云同步周期（秒）；0 = 仅手动同步。最小间隔 60s

# ===== AIUI 全链路（极速超拟人链路）：启用后设备流水线切换为 VAD 切段 → AIUI 云端闭环
#       （识别 + 大模型 + 合成一体，发音人目录见 AIUI 文档 3.9），本地 ASR/LLM/TTS 引擎闲置。
#       ⚠️ 需在 AIUI 平台（aiui.xfyun.cn）开通极速超拟人服务；对话上下文按连接保留。
# [aiui]
# enabled = true
# appid = "your_appid"
# api_key = "your_api_key"
# api_secret = "your_api_secret"
# scene = "main"                       # 平台上 appid 下的情景模式（main_box 为测试环境）
# sn_prefix = "xiaozhi"                # 设备标识前缀（云端个性化绑定）
# voice = "x6_dongmanshaonv_pro"       # 发音人（极速超拟人目录）
# speed = 50                           # 语速/音量/音调（0~100，50 常速）
# volume = 50
# pitch = 50
# prompt = ""                          # 自定义人设（可空）

# ===== 灵魂（人格档案）=====
# 关闭（默认）时完全退回上面的 [llm].system_prompt —— 输出逐字节一致，可随时回滚。
# 打开后，系统提示词由「平台约束 + 人格主体 + 表达风格 + [llm].system_prompt」按序拼成。
#
# 内置默认灵魂（preset）：开箱就有一份像样的人格，不必先填 20 个字段。
#   preset = "xiaozhi"（默认）= 内置的「小智」人格
#   preset = "none"            = 不用内置基线（完全自定义；此时 name / address_user 必须自己填）
# 合并规则：**留空**（空串/空数组）的字段由预设补，**填了**的字段逐字段覆盖它。
#   所以"改默认"= 直接改下面的字段；"覆盖"= 填上自己的内容；想整份换掉就 preset = "none"。
#   未知 preset 值会在保存/启动时报错并列出可选值（绝不静默回退）。
# 看效果：管理页灵魂卡有「预览最终提示词」（`POST /api/soul/preview`），
#   会显示最终 instructions、字符/token 数，以及"哪些字段来自预设、哪些被你覆盖"。
# 可在任意字段里用 {{name}} / {{address_user}} / {{device_id}} 引用运行时值
# （未声明的变量会在**保存/启动时**报错，而不是把 {{xxx}} 原样塞给模型）。
# ⚠️ 语音第一性原则是「短」：max_sentences / max_chars 会作为硬约束写进提示词；
#    emoji 默认关闭（TTS 会把 emoji 念出来）。
[soul]
enabled = true                      # 默认 true = 启用人格档案（开箱即用 xiaozhi 预设；不需要可改 false）
preset = "xiaozhi"                  # 内置人格预设（"none" = 不用预设，完全自定义）
name = "小智"                        # 自称（留空 = 用预设提供的名字）
self_intro = ""                     # 自我定位（一段话：你是谁、在做什么）
form = ""                           # 形象/物种，如「一只住在音箱里的小狐狸」
age_feel = ""                       # 给人的年龄感，如「十来岁」
worldview = ""                      # 世界观（世界是什么样的）
backstory = ""                      # 来历/背景故事
relationship_origin = ""            # 与用户的关系是怎么开始的（比"关系=朋友"更能锁定语气）
traits = []                         # 性格：每行一条「标签：遇到 X 会怎么做」（只写形容词会失效）
values = []                         # 坚持的价值
boundaries = []                     # 红线/拒绝清单
tone = ""                           # 语气，如「轻快、温和」
colloquial = true                   # 说人话：短句、省略主语
address_user = "你"                  # 称呼用户
catchphrases = []                   # 口头禅（自然使用，不必每句都用）
emoji = false                       # ⚠️ 语音默认关：TTS 会把 emoji 念出来
max_sentences = 2                   # 回复句数硬上限（1~8）
max_chars = 40                      # 回复字数硬上限（10~500）
scenario = ""                       # 当前情境，如「书房里，晚上」
device_hint = ""                    # 设备提示，如「这是放在客厅的音箱」
examples = []                       # 风格范例：每条一组 Q/A（锁风格最有效的手段）
                                    # 例：examples = ["用户：今天几度？\n小智：我看不到天气，你手机上看一眼？"]

# ===== 记忆（本地图记忆）=====
# 默认开启（enabled = true）：开箱即用；提取未配 LLM 路由时只记原文、提示降级，不阻断会话。
# 改 false = 零依赖零成本（行为与加记忆之前完全一致）。
# 打开后：每轮对话写入本地 SQLite（原文事实源），后台用一次辅助模型调用抽取摘要，
# 下一轮提问时按词法（摘要汉字二元组倒排索引）召回，注入**原始 Q/A**作为背景资料。
# ⚠️ 目前**不含 embedding**：召回是本地词法（中文场景可用、零外网调用）；语义检索为后续阶段。
# ⚠️ 记忆只在本地 LLM 流水线生效：启用 [aiui] 全链路时云端闭环绕过本地 LLM，人格/记忆都不参与。
[memory]
enabled = true                      # 默认 true = 启用记忆（不需要可改 false）
engine = "graph"                    # graph = 内置图记忆 | store = 纯存储（只存原文不抽取不召回，先积累再决定）| rag = 本地文档 RAG（词法检索，零外网）| none = 保留配置但不生效（旧键 backend 仍可读）
db_path = "/data/data.db"        # ⚠️ 必须放在挂载卷内，否则重建容器即丢全部记忆（graph/store/rag 共用，切后端数据不丢）；与配置库共用同一文件
db_busy_timeout_ms = 5000           # SQLite 写锁等待（与 DSH 桌面端共用同一库文件时才需调大）
recall_enabled = true               # false = 只写不读（先积累数据）
extraction_enabled = true           # false = 只存原文、不调用辅助模型（没有摘要可召回）
fresh_turn_count = 5                # 最近这几轮原文已在会话上下文里，不重复召回（省 token）
recall_max_nodes = 6                # 每次最多召回几条
recall_max_tokens = 400             # 注入正文的硬上限（中文按约 1 token/字估算）
recall_budget_ms = 300              # 关键路径预算：超时立即按「无记忆」继续，不拖慢首字延迟
maintenance_interval = 6            # 每 N 轮做一次保留策略与隔离重试（后台）
inject_position = "after_history"   # after_history（默认，护住前缀缓存）/ before_history
quarantine_max_attempts = 3         # 抽取失败的最大尝试次数，超过即永久隔离
scope_prefix = "xiaozhi"            # 记忆按 <前缀>:<设备号> 隔离

[memory.retention]                  # 原文保留策略（默认全部保留，最安全）
keep = "all"                        # all | referenced（只留被记忆引用的）/ recent（最近 N 轮外）
recent_turns = 0                    # keep = "recent" 时生效
retention_days = 0                  # 超过 N 天的未引用原文可删（0 = 不限）
dry_run = false                     # true = 只演练不删除（先看清会删多少条）
# ⚠️ 被轮次记忆引用的原文**永不删除**（上游 graph-memory 有误删证据的缺陷，我们刻意规避）。

[memory.extractor]                  # 抽取专用模型路由（字段留空 = 复用 [llm]）
api_base = ""                       # 可指向更便宜的端点
api_key = ""                        # 留空不修改；GET /api/config 永不回传明文
model = ""                          # 建议用小模型（抽取只要稳定 JSON）
temperature = 0.1

[memory.rag]                        # engine = "rag" 时的本地文档索引（P1-9；独立索引表，与 graph/store 数据互不干扰）
docs_dir = "/data/rag-docs"         # ⚠️ 放挂载卷内；扫描 txt/md 文件建词法索引（管理台「记忆」section 可触发重建）
chunk_size = 512                    # 分块字符数（保守分块，中文场景可用）
chunk_overlap = 64                  # 相邻分块重叠字符数
top_k = 4                           # 每次召回最多注入几个分块（受 recall_max_tokens 硬上限约束）

# ===== SQLite 配置库（唯一配置真源；外置 config.toml 文件配置逻辑已移除）=====
# 配置存进 SQLite（与 memory 共用同一 db 文件，或独立文件）；所有保存、设备
# overlay、预设都落库。空库首启以内置默认启动并落库，改配置走管理页 / PUT /api/config。
#
# 配置库路径解析优先级（唯一权威，见 server/src/main.rs::load_config_inner）：
#   1. 环境变量 XIAOZHI_CONFIG_DB        （容器/测试注入，优先级最高）
#   2. 启动参数       --config-db <path>
#   3. 兜底           /data/data.db    （当上述都无效时）
#
# 因此默认情况下配置库 = /data/data.db（与记忆同文件）；若要配置与记忆分库，
# 设 XIAOZHI_CONFIG_DB 或 --config-db 指向别的路径即可。
#
# ⚠️ 必须放在挂载卷内（与 memory 同约束，见上方 volumes），否则重建容器即丢全部配置。
# ⚠️ DB 打开失败时进程**启动即失败退出**（配置是必需能力，无降级路径）。
#
# 远程只读访问（用数据库客户端"直连"查看配置库内容）：
#   POST /api/config/db/query   Bearer token 鉴权；请求体 {"sql":"SELECT ..."}；
#                               仅允许单条 SELECT/WITH/PRAGMA/EXPLAIN，最多 1000 行；
#                               不暴露库文件路径、不支持远程改库（只读护栏）。
#   POST /api/config/db/backup  VACUUM INTO 生成一致性快照 xiaozhi-config-backup-<unix秒>.db。
#   表清单：cfg_documents（配置文档）/ cfg_revisions（历史）/ cfg_device_overlays（设备覆盖）/ cfg_presets（预设）。


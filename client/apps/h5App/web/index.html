<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>XiaoZhi Admin</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1e; }
        #root { width: 100%; height: 100%; color-scheme: dark; }
        /* Pinned H5ListView adds these official classes for Scroller/Tabs. Keep
           native scroll gutters from consuming Kuikly's fixed-height viewports. */
        #root .isList { scrollbar-width: thin; scrollbar-color: #5a5a60 #1c1c1e; }
        #root .isList::-webkit-scrollbar { width: 8px; height: 8px; }
        #root .isList::-webkit-scrollbar-track { background: #1c1c1e; }
        #root .isList::-webkit-scrollbar-thumb { background: #5a5a60; border-radius: 4px; }
        #root .isList.list-no-scrollbar { scrollbar-width: none; }
        #root .isList.list-no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- 1. 业务页面 bundle（:shared:packLocalJSBundleRelease 产出，需先加载——注入 Kuikly core 桥接） -->
    <script type="text/javascript" src="./nativevue2.js"></script>
    <!-- 2. H5 壳（core-render-web 渲染器 + 入口 Main.kt），:apps:h5App 产出 -->
    <script type="text/javascript" src="./h5App.js"></script>
</body>
</html>

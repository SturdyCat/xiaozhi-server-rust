# ===== Kuikly 版本（必须与服务端 / 各宿主一致）=====
# 开源版 com.tencent.kuikly-open 的坐标版本格式为 <kuikly>-<kotlin>，
# 例如 2.28.0-2.1.21 表示 Kuikly 2.28.0（绑定 Kotlin 2.1.21）。
# 与下方 kotlin plugin 版本（2.1.21）保持一致。
# 版本号规则（官方）：KMP 制品与安卓渲染层用 <kuikly>-<kotlin>；iOS/鸿蒙渲染层用裸 <kuikly>。
# ⛔ 升级时两处同步：① 本行；② 根 build.gradle.kts 的 core-gradle-plugin classpath
#    （②无法读本值——buildscript 块在 project 属性求值之前执行，只能字面量双写）。
kuiklyVersion=2.28.0-2.1.21

# ===== 通用 Gradle 配置（内存口径对齐 xiaoya-player，ACR/Docker 构建机内存有限）=====
kotlin.code.style=official
# heap 有界（不会无限制爬升被 OOM killer 盯上）；Dockerfile 会以同量级上限覆盖。
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
# 构建机内存有限：关 configuration cache 与并行，宁可慢一点也不要内存峰值叠加。
org.gradle.configuration-cache=false
org.gradle.parallel=false
android.useAndroidX=true
kotlin.mpp.stability.nowarn=true

# ===== KSP =====
# Kuikly 的 @Page 处理器与增量 KSP 存在兼容问题（xiaoya 实测口径），关掉增量。
ksp.incremental=false
# KSP 用工程内声明的版本（2.1.21-2.0.1），不用 Kuikly 插件自带版本。
kuikly.useLocalKsp=true

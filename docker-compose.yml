# xiaozhi-server-rust 部署编排
#
# 用法：
#   1. （可选）手动预置模型：  ./server/scripts/download_models.sh ./server-data/models
#      —— 不预置也没关系：容器首次启动会自动检测缺失并下载到挂载的 ./server-data，
#         之后文件已存在即跳过（见 docker-entrypoint.sh + 下方 XIAOZHI_AUTO_DOWNLOAD_MODELS）。
#   2. 配置通过管理台/API 写入 server-data/data.db；config.example.toml 仅作字段参考。
#      空库首启直接使用底座默认配置，不自动启用 EchoMuse/Tuya 等业务插件。
#   3. 构建启动：  docker compose up -d --build
#   4. 查看日志：  docker compose logs -f xiaozhi
#   5. 停止：      docker compose down
#
# 说明：
#   - 镜像由 Dockerfile 三阶段构建：web 阶段构建 Kuikly H5 管理页（client 工程）+
#     Rust 阶段编译 server（--features sherpa,wasm-plugins,pure-base），运行时同源托管管理页
#     与 /api；WASM 宿主随二进制交付，但镜像不预置任何业务组件。
#     浏览器访问 http://<host>:8000/ 即管理后台（配置页读写 SQLite 配置库 data.db）。
#   - 运行时需挂载模型目录；模型目录必须可写（不要挂 :ro）：
#     入口脚本会在缺失时写入 ./server-data 并持久化。
#   - 配置库路径优先级：环境变量 XIAOZHI_CONFIG_DB > --config-db 参数 > /data/data.db 兜底；空库以内置默认启动并落库。
#   - 健康检查：镜像内置 HEALTHCHECK（curl /api/health，运行层已装 curl）；
#     端口自动读取服务启动落盘的 /data/.runtime_port，改 [server].port 即可
#     （host 网络下无 ports 映射，端口即宿主端口；宿主 80 被其他程序占用会启动失败）。
#   - 无 mock：ASR/TTS/LLM 恒为真实引擎（SenseVoice/Kokoro/OpenAI 兼容 HTTP），
#     模型未就绪或 LLM 未配置时对应功能启动/调用报错，不再有零模型回退。

services:
  xiaozhi:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaozhi-server-rust:latest
    container_name: xiaozhi-server
    restart: unless-stopped
    # CPU 配额：容器最多使用 3.5 核（N5105 四核，留 0.5 核给宿主机/其他服务）。
    # TTS 合成线程 [tts].num_threads=4 会在这 3.5 核配额内由内核调度，
    # 合成吞吐 ≈ 3.5 核，不会占满整机（等价 --cpus=3.5，见 docker compose config 核对）。
    cpus: "3.5"
    # host 网络：服务监听 [server].port（默认 8000），host 网络下直接就是宿主端口，
    # 浏览器访问 http://<host>:8000/，设备连 ws://<host>:8000/，不再有 ports 映射。
    # macOS/Windows 的 Docker Desktop 不支持 host 网络，请改用 Linux 宿主部署，
    # 或在桌面系统上直跑二进制；改端口只改 [server].port。
    network_mode: host
    environment:
      # 配置库文件（与 memory 同卷；空库首启以内置默认启动并落库）。
      XIAOZHI_CONFIG_DB: /data/data.db
      # 可选：日志过滤（EnvFilter 语法，如 debug）。默认不设，用 main.rs 内置过滤。
      # RUST_LOG: debug
      # 自动下载模型：missing(默认，缺失才下) | force(强制重下) | off(不下载)
      # 模型从 k2-fsa/sherpa-onnx 官方 GitHub Release 下载整包 tar.bz2 并解压覆盖。
      XIAOZHI_AUTO_DOWNLOAD_MODELS: "missing"
      # GitHub 代理前缀（和以前一样：配置了才走代理，不配置直连原始地址）。
      # 直连 github.com / release-assets 不可达的环境按需配置；off 亦表示直连。
      GITHUB_PROXY: "https://tvv.tw/"
      # 下载地址可被 SENSEVOICE_URL/KOKORO_URL/SILERO_VAD_URL 覆盖为完整直链
      # （内网镜像，显式 URL 不会被二次套代理），需要时自行添加。
    volumes:
      # ★ 唯一数据卷：宿主 ./server-data ↔ 容器 /data，**内部分目录**各司其职：
      #   /data/models/SenseVoiceSmall 等   模型（首启缺失时入口脚本自动下载，持久化）
      #   /data/data.db                     配置+记忆共用的 SQLite 库（配置唯一真源：
      #                                管理页「保存配置」写 cfg_documents；空库首启自举默认配置）
      #   /data/plugins/<id>.wasm             运行期上传的插件 artifact（默认目录为空；
      #                                         不随镜像预置，重启由 WASM 宿主扫描重装）
      # ⚠️ 必须是**可写**挂载（勿加 :ro）。目录挂载支持原子 rename——
      #   旧版「单文件 bind mount → rename EBUSY → 回退原地写」的问题自此布局起不存在。
      - ./server-data:/data
      # NLU 模型训练（POST /api/nlu/model/build）在宿主 Docker 中运行临时训练容器；
      # 服务器仍只提供训练编排/状态与候选管理，训练依赖由独立镜像提供。
      - /var/run/docker.sock:/var/run/docker.sock

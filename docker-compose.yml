# xiaozhi-server-rust 部署编排
#
# 用法：
    #   1. （可选）手动预置模型：  ./scripts/download_models.sh ./models
#      —— 不预置也没关系：容器首次启动会自动检测缺失并下载到挂载的 ./models，
#         之后文件已存在即跳过（见 docker-entrypoint.sh + 下方 XIAOZHI_AUTO_DOWNLOAD_MODELS）。
#   2. 准备配置：  cp server/config.example.toml server/config.toml   # 按需修改 token / api_key / 模型路径
#   3. 构建启动：  docker compose up -d --build
#   4. 查看日志：  docker compose logs -f xiaozhi
#   5. 停止：      docker compose down
#
# 说明：
#   - 镜像由 Dockerfile 三阶段构建：web 阶段构建 Kuikly H5 管理页（client 工程）+
#     Rust 阶段编译 server（--features sherpa），运行时同源托管管理页与 /api。
#     浏览器访问 http://<host>:8000/ 即管理后台（配置页读写 config.toml）。
#   - 运行时需挂载模型目录；模型目录必须可写（不要挂 :ro）：
#     入口脚本会在缺失时写入 ./models 并持久化。
#   - 配置加载优先级：环境变量 XIAOZHI_CONFIG > --config 参数 > 内置 mock 默认。
#   - 健康检查：镜像内置 HEALTHCHECK（curl /api/health，运行层已装 curl）；
#     若自定义 [server].listen 端口，需同步改 Dockerfile 里的 HEALTHCHECK。
#   - 仅做本地联调（无模型）时：把 config 里 [asr]/[tts]/[llm] 的 backend 改为 "mock"，
#     并设 XIAOZHI_AUTO_DOWNLOAD_MODELS=off、注释掉 models 挂载即可零模型启动
#     （见下方「mock 模式」示例）。

services:
  xiaozhi:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaozhi-server-rust:latest
    container_name: xiaozhi-server
    restart: unless-stopped
    # CPU 配额：容器最多使用 3.5 核（N5105 四核，留 0.5 核给宿主机/其他服务）。
    # TTS 合成线程 [tts].num_threads=4 会在这 3.5 核配额内由内核调度，
    # 合成吞吐 ≈ 3.5 核，不会占满整机（等价 --cpus=3.5，见 docker compose config 核对）。
    cpus: "3.5"
    ports:
      - "8000:8000"
    environment:
      # 指向容器内配置文件（见下方 volumes 挂载）。
      # 设为不存在的路径会触发告警并回退到内置 mock 默认配置（适合无模型联调）。
      XIAOZHI_CONFIG: /etc/xiaozhi/config.toml
      # 可选：调整日志级别（默认 info）；如 debug / warn
      RUST_LOG: info
      # 自动下载模型：missing(默认，缺失才下) | force(每次重下) | off(不下载)
      XIAOZHI_AUTO_DOWNLOAD_MODELS: "missing"
      # GitHub 代理前缀（默认 https://tvv.tw/）：直连 github.com/release-assets
      # 不可达的环境靠它下载模型；GITHUB_PROXY=off 可关闭走直连。
      GITHUB_PROXY: "https://tvv.tw/"
    volumes:
      # 配置：默认直接挂 server/config.example.toml（已含 /models/... 路径，开箱即用）；
      #       若已 cp 为 server/config.toml，把上面 XIAOZHI_CONFIG 路径一并改掉即可。
      - ./server/config.toml:/etc/xiaozhi/config.toml:ro
      # 模型：宿主 ./models 挂载进容器；首启缺失时由入口脚本自动下载并写入（需可写），
      #       下载后持久化，后续启动检测到文件即跳过。
      - ./models:/models

  # ---- mock 模式（零模型本地联调，无需下载模型）----
  # 用法：docker compose --profile mock up -d --build
  # 说明：复用同一镜像，仅令 XIAOZHI_CONFIG 指向不存在文件 → 回退内置 mock 默认，
  #       不挂载模型目录，ASR/TTS/LLM 全部走本地回显，可直接跑通协议联调。
  # xiaozhi-mock:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   image: xiaozhi-server-rust:latest
  #   container_name: xiaozhi-server-mock
  #   restart: unless-stopped
  #   ports:
  #     - "8001:8000"
  #   environment:
  #     XIAOZHI_CONFIG: /dev/null   # 故意指向不存在/不可解析文件 → 回退 mock 默认
  #     RUST_LOG: info
  #   profiles: ["mock"]

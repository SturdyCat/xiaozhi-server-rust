<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小智语音服务端 · 测试台</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e4e7ec; --ink: #1a1d23; --sub: #667085;
    --brand: #2563eb; --ok: #16a34a; --warn: #d97706; --err: #dc2626; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--sub); margin: 0 0 20px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  label { font-size: 12px; color: var(--sub); }
  input, select, textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
                  font-size: 13px; background: #fff; color: var(--ink); font-family: inherit; }
  input { flex: 1; min-width: 180px; }
  textarea { width: 100%; resize: vertical; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--brand);
           color: #fff; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: #eef1f6; color: var(--ink); }
  button.danger { background: var(--err); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }
  .hint { font-size: 12px; color: var(--sub); margin-top: 8px; }

  /* ASR 麦克风大按钮 */
  .mic-wrap { display: flex; align-items: center; gap: 18px; }
  .mic-btn { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer;
             background: #eef1f6; font-size: 30px; line-height: 1;
             display: flex; align-items: center; justify-content: center;
             transition: transform .15s, background .15s; }
  .mic-btn:disabled { opacity: .45; cursor: not-allowed; }
  .mic-btn.rec { background: #fee2e2; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(220,38,38,.45); }
    70%  { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .mic-stat b { display: block; font-size: 14px; color: var(--ink); }
  .mic-stat span { font-size: 12px; color: var(--sub); }
  #asrResult { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line);
               border-radius: 8px; min-height: 44px; font-size: 14px; background: #fafbfc; }
  #ttsStatus { font-size: 13px; color: var(--sub); }

  #log { background: #10141b; color: #c7d0dd; border-radius: 8px; padding: 12px;
         font: 12px/1.7 var(--mono); height: 200px; overflow: auto; white-space: pre-wrap;
         word-break: break-all; }
  #log .up   { color: #7cc0ff; }
  #log .down { color: #86e3a1; }
  #log .meta { color: #8b95a5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>小智语音服务端 · 测试台</h1>
  <p class="sub">浏览器直连 <code>/api/ws</code>：<b>① 语音识别（ASR）</b>：录音 → 识别 → 展示文本；<b>② 语音合成（TTS）</b>：文本 → 选语言/角色 → 合成播放。</p>

  <!-- 连接 -->
  <div class="card">
    <h2><span class="dot" id="connDot"></span>连接</h2>
    <div class="row">
      <label>服务地址</label>
      <input id="url" value="ws://127.0.0.1:8000/api/ws" spellcheck="false">
      <label>Token</label>
      <input id="token" placeholder="留空 = 不鉴权" style="flex:0 1 160px" spellcheck="false">
      <button id="btnConn">连接</button>
      <button id="btnDisc" class="ghost" disabled>断开</button>
    </div>
    <div class="hint" id="nego"></div>
  </div>

  <!-- ① ASR -->
  <div class="card">
    <h2>① 语音识别（ASR）</h2>
    <div class="mic-wrap">
      <button id="micBtn" class="mic-btn" disabled title="点击开始录音">🎤</button>
      <div class="mic-stat">
        <b id="micTitle">未录音</b>
        <span id="micTime">点击麦克风图标开始录音</span>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="btnRecog" disabled>开始识别</button>
      <button id="btnAsrClear" class="ghost" disabled>清空结果</button>
    </div>
    <div id="asrResult">识别结果将显示在这里</div>
    <div class="hint">录音经 Opus 编码上行，服务端对整段录音一次性识别（跳过 VAD 自动切段）。mock 后端会返回固定演示文本。</div>
  </div>

  <!-- ② TTS -->
  <div class="card">
    <h2>② 语音合成（TTS）</h2>
    <textarea id="ttsText" rows="3" placeholder="输入要合成的文本（识别后可一键填入）"></textarea>
    <div class="row" style="margin-top:10px">
      <label>语言</label>
      <select id="ttsLang">
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
      </select>
      <label>语音角色</label>
      <select id="ttsSpeaker">
        <option value="0" selected>角色 0</option>
        <option value="1">角色 1</option>
        <option value="2">角色 2</option>
        <option value="3">角色 3</option>
        <option value="4">角色 4</option>
        <option value="5">角色 5</option>
        <option value="6">角色 6</option>
        <option value="7">角色 7</option>
        <option value="8">角色 8</option>
        <option value="9">角色 9</option>
      </select>
      <button id="btnTts" disabled>开始转换</button>
      <button id="btnStopPlay" class="ghost" disabled>停止播放</button>
      <button id="btnFillStt" class="ghost" disabled>填入识别结果</button>
    </div>
    <div class="hint" id="ttsStatus">待连接。切换语言首次合成为冷启动（服务端需构建对应引擎，约数秒）。</div>
  </div>

  <!-- 日志 -->
  <div class="card">
    <h2>消息日志 <button class="ghost" id="btnClear" style="margin-left:auto;padding:4px 10px">清空</button></h2>
    <div id="log"></div>
  </div>
</div>

<script>
"use strict";
// ---------- 地址与 Token 自动填充 ----------
// 服务端托管时默认连同源 /api/ws；支持 ?token= 自动填充。
(function () {
  const q = new URLSearchParams(location.search);
  const tk = q.get("token");
  if (tk) document.getElementById("token").value = tk;
  const urlInput = document.getElementById("url");
  if (urlInput.value.includes("127.0.0.1:8000") && location.protocol.startsWith("http")) {
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    urlInput.value = wsProto + "//" + location.host + "/api/ws";
  }
})();

const $ = id => document.getElementById(id);
const logBox = $("log");
function log(cls, text) {
  const d = new Date();
  const t = d.toLocaleTimeString("zh-CN", { hour12: false }) + "." +
            String(d.getMilliseconds()).padStart(3, "0");
  const div = document.createElement("div");
  const span = document.createElement("span");
  span.className = cls; span.textContent = "[" + t + "] " + text;
  div.appendChild(span); logBox.appendChild(div);
  if (logBox.childNodes.length > 500) logBox.removeChild(logBox.firstChild);
  logBox.scrollTop = logBox.scrollHeight;
}

// ---------- 状态 ----------
let ws = null, connected = false;
let downlinkVer = "auto", sniffed = null;           // 下行解包方式
let decoder = null, playCtx = null, nextStart = 0;  // TTS 播放
let enc = null, micCtx = null, micNode = null, micStream = null;
let recording = false, encSamples = 0, recStartTs = 0, recTimer = null;
let dlFrames = 0, lastStt = "";

function setDot(id, cls) { const d = $(id); d.className = "dot" + (cls ? " " + cls : ""); }
function setUI() {
  $("btnConn").disabled = connected;
  $("btnDisc").disabled = !connected;
  $("micBtn").disabled = !connected;
  $("btnRecog").disabled = !connected || recording;
  $("btnTts").disabled = !connected;
  $("btnStopPlay").disabled = !connected;
}

// ---------- 连接 ----------
$("btnConn").onclick = () => {
  let u = $("url").value.trim();
  if (!u.startsWith("ws://") && !u.startsWith("wss://")) { log("meta", "地址须以 ws:// 或 wss:// 开头"); return; }
  const tk = $("token").value.trim();
  if (tk) u += (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(tk);
  log("meta", "连接 " + u.replace(/token=[^&]+/, "token=***"));
  ws = new WebSocket(u);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    connected = true; setDot("connDot", "on"); setUI();
    // 设备 hello：version=1 → 上行裸 Opus 包；上行 16k 单声道
    sendText({ type: "hello", version: 1, transport: "websocket",
      audio_params: { format: "opus", sample_rate: 16000, channels: 1, frame_duration: 60 },
      features: { mcp: false, aec: true } });
  };
  ws.onmessage = ev => {
    if (typeof ev.data === "string") onText(JSON.parse(ev.data));
    else onBinary(new Uint8Array(ev.data));
  };
  ws.onclose = () => { log("meta", "连接已关闭"); cleanup(); };
  ws.onerror = () => log("meta", "连接错误（检查地址/端口，或服务端 token 鉴权拒绝）");
};
$("btnDisc").onclick = () => { if (ws) ws.close(); };
$("btnClear").onclick = () => { logBox.textContent = ""; };

function sendText(obj) { ws.send(JSON.stringify(obj)); log("up", JSON.stringify(obj)); }

function cleanup() {
  connected = false; setDot("connDot"); setUI();
  stopCapture();
  if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
  nextStart = 0; sniffed = null; dlFrames = 0;
  $("nego").textContent = "";
}

// ---------- 服务器文本消息 ----------
function onText(m) {
  log("down", JSON.stringify(m));
  switch (m.type) {
    case "hello": {
      const ap = m.audio_params || {};
      $("nego").textContent = "已连接：下行 " + (ap.sample_rate || "?") + " Hz / " +
        (ap.frame_duration || "?") + "ms 帧";
      initDecoder(ap.sample_rate || 24000);
      break;
    }
    case "stt": {
      lastStt = m.text || "";
      $("asrResult").textContent = lastStt;
      $("btnAsrClear").disabled = false;
      $("btnFillStt").disabled = false;
      if (!$("ttsText").value.trim()) $("ttsText").value = lastStt;  // 自动填入合成框
      setMicState("idle");
      break;
    }
    case "tts":
      if (m.state === "start") $("ttsStatus").textContent = "服务端合成中…";
      if (m.state === "sentence_start") $("ttsStatus").textContent = "播放中：" + (m.text || "");
      if (m.state === "stop") {
        $("ttsStatus").textContent = "播放完毕";
        setDot("connDot", "on");
      }
      break;
  }
}

// ---------- 下行二进制（TTS Opus 播放） ----------
function pickUnwrap(data) {
  if (downlinkVer !== "auto") return downlinkVer;
  if (sniffed) return sniffed;
  if (data.length >= 18 && data[0] === 0x01 && data[1] === 0x00) sniffed = "2";
  else if (data.length >= 6 && data[0] === 0x00 && data[1] === 0x00) sniffed = "3";
  else sniffed = "1";
  log("meta", "下行二进制版本嗅探为 v" + sniffed);
  return sniffed;
}

function unwrapMirror(data) {
  const v = pickUnwrap(data);
  if (v === "1") return data;
  if (v === "2") {
    if (data.length < 16) return null;
    const size = data[12] | data[13] << 8 | data[14] << 16 | data[15] << 24;
    return data.length >= 16 + size ? data.subarray(16, 16 + size) : null;
  }
  if (data.length < 4) return null;
  const size = data[2] | data[3] << 8;
  return data.length >= 4 + size ? data.subarray(4, 4 + size) : null;
}

function initDecoder(sampleRate) {
  if (!window.AudioDecoder) { log("meta", "浏览器无 AudioDecoder，TTS 无法播放"); return; }
  if (decoder) { try { decoder.close(); } catch (e) {} }
  decoder = new AudioDecoder({
    output: ad => schedulePlay(ad),
    error: e => log("meta", "解码器错误: " + e.message),
  });
  decoder.configure({ codec: "opus", sampleRate: sampleRate, numberOfChannels: 1 });
  log("meta", "AudioDecoder 就绪（" + sampleRate + " Hz）");
}

function ensurePlayCtx() {
  if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (playCtx.state === "suspended") playCtx.resume();
}

function schedulePlay(ad) {
  ensurePlayCtx();
  const n = ad.numberOfFrames, sr = ad.sampleRate;
  const pcm = new Float32Array(n);
  ad.copyTo(pcm, { planeIndex: 0, format: "f32-planar" });
  ad.close();
  const buf = playCtx.createBuffer(1, n, sr);
  buf.copyToChannel(pcm, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf; src.connect(playCtx.destination);
  const now = playCtx.currentTime;
  if (nextStart < now + 0.03) nextStart = now + 0.03;
  src.start(nextStart);
  nextStart += n / sr;
}

function onBinary(data) {
  dlFrames++;
  if (dlFrames === 1 || dlFrames % 50 === 0)
    log("down", "⟨音频 #" + dlFrames + "⟩ " + data.length + " 字节");
  if (!decoder) return;
  const payload = unwrapMirror(data);
  if (!payload || !payload.length) return;
  try {
    decoder.decode(new EncodedAudioChunk({
      type: "key", timestamp: dlFrames * 60000, data: payload,
    }));
  } catch (e) { log("meta", "送解码失败: " + e.message); }
}

// ---------- ① ASR：录音 → 识别 ----------
const WORKLET = `
class PcmFeeder extends AudioWorkletProcessor {
  constructor(){ super(); this.buf = new Float32Array(960); this.fill = 0; } // 60ms @16k
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (ch) {
      let i = 0;
      while (i < ch.length){
        const n = Math.min(ch.length - i, this.buf.length - this.fill);
        this.buf.set(ch.subarray(i, i + n), this.fill);
        this.fill += n; i += n;
        if (this.fill === this.buf.length){
          this.port.postMessage(new Float32Array(this.buf));
          this.fill = 0;
        }
      }
    }
    return true;
  }
}
registerProcessor('pcm-feeder', PcmFeeder);`;

function setMicState(state) {
  const btn = $("micBtn"), title = $("micTitle"), time = $("micTime");
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (state === "rec") {
    btn.classList.add("rec"); btn.textContent = "⏹"; btn.title = "点击停止录音";
    title.textContent = "录音中…";
  } else if (state === "ready") {
    btn.classList.remove("rec"); btn.textContent = "🎤"; btn.title = "重新录音";
    title.textContent = "录音结束";
  } else {
    btn.classList.remove("rec"); btn.textContent = "🎤"; btn.title = "点击开始录音";
    title.textContent = "未录音";
    time.textContent = "点击麦克风图标开始录音";
  }
  $("btnRecog").disabled = !connected || recording;
}

$("micBtn").onclick = async () => {
  if (recording) { stopCapture(); return; }
  startCapture();
};

async function startCapture() {
  if (!window.AudioEncoder || !window.AudioData) {
    log("meta", "浏览器缺少 WebCodecs（AudioEncoder），请用 Chrome/Edge"); return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) { log("meta", "获取麦克风失败: " + e.message); return; }

  micCtx = new AudioContext({ sampleRate: 16000 }); // 浏览器自动重采样到 16k
  const blob = new Blob([WORKLET], { type: "application/javascript" });
  await micCtx.audioWorklet.addModule(URL.createObjectURL(blob));
  micNode = new AudioWorkletNode(micCtx, "pcm-feeder");
  micNode.port.onmessage = ev => feedEncoder(ev.data);
  micCtx.createMediaStreamSource(micStream).connect(micNode); // 不连 destination，避免回声

  encSamples = 0;
  enc = new AudioEncoder({
    output: chunk => {
      const bytes = new Uint8Array(chunk.byteLength);
      chunk.copyTo(bytes);
      if (ws && ws.readyState === 1) ws.send(bytes); // v1：一条消息一个 Opus 包
    },
    error: e => log("meta", "编码器错误: " + e.message),
  });
  enc.configure({ codec: "opus", sampleRate: 16000, numberOfChannels: 1, bitrate: 32000 });

  recording = true; encSamples = 0; recStartTs = Date.now();
  setMicState("rec");
  sendText({ type: "asr_test", action: "start" });
  recTimer = setInterval(() => {
    const s = (Date.now() - recStartTs) / 1000;
    $("micTime").textContent = "已录 " + s.toFixed(1) + " 秒 · 16 kHz · 点击图标停止";
  }, 100);
}

function stopCapture() {
  recording = false;
  setMicState("ready");
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micNode) { micNode.disconnect(); micNode = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (enc) {
    const e = enc; enc = null;
    e.flush().then(() => e.close()).catch(() => e.close());
  }
}

$("btnRecog").onclick = () => {
  if (recording) stopCapture();     // 还在录先停采集
  $("micTime").textContent = "识别中…";
  sendText({ type: "asr_test", action: "stop" });
};

$("btnAsrClear").onclick = () => {
  $("asrResult").textContent = "识别结果将显示在这里";
  $("btnAsrClear").disabled = true;
};

// ---------- ② TTS：文本 → 合成播放 ----------
$("btnTts").onclick = () => {
  const text = $("ttsText").value.trim();
  if (!text) { $("ttsStatus").textContent = "请先输入要合成的文本"; return; }
  ensurePlayCtx(); // 用户手势内解锁播放
  nextStart = 0; dlFrames = 0;
  if (decoder) { try { decoder.reset(); } catch (e) {} }
  const lang = $("ttsLang").value;
  const speaker = parseInt($("ttsSpeaker").value, 10) || 0;
  $("ttsStatus").textContent = "已发送合成请求…";
  sendText({ type: "tts_test", text, lang, speaker });
};

$("btnStopPlay").onclick = () => {
  if (decoder) { try { decoder.reset(); } catch (e) {} }
  nextStart = 0;
  sendText({ type: "abort", reason: "web-stop-playback" });
  $("ttsStatus").textContent = "已停止播放";
};

$("btnFillStt").onclick = () => { $("ttsText").value = lastStt; };

setUI();
log("meta", "页面就绪：点击「连接」后即可测试 ASR 与 TTS。麦克风需 Chrome/Edge 且 localhost/HTTPS。");
</script>
</body>
</html>
